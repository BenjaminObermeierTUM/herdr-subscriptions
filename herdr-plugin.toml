id = "subscriptions"
name = "Subscriptions"
version = "0.4.3"
min_herdr_version = "0.9.5"
description = "An independent Subscriptions section for Claude and Codex limits, credits and saved resets, with an optional companion Herdr client."
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "-m", "herdr_subscriptions", "start"]

[[actions]]
id = "open"
title = "Subscriptions: open dashboard"
command = ["python3", "-m", "herdr_subscriptions", "open"]

[[actions]]
id = "refresh"
title = "Subscriptions: refresh now"
command = ["python3", "-m", "herdr_subscriptions", "request-refresh"]

[[actions]]
id = "start"
title = "Subscriptions: start sidebar updates"
command = ["python3", "-m", "herdr_subscriptions", "start"]

[[actions]]
id = "stop"
title = "Subscriptions: stop sidebar updates"
command = ["python3", "-m", "herdr_subscriptions", "stop"]

[[actions]]
id = "setup"
title = "Subscriptions: preview sidebar setup"
command = ["python3", "-m", "herdr_subscriptions", "setup"]

[[panes]]
id = "dashboard"
title = "Subscriptions"
placement = "overlay"
command = ["python3", "-m", "herdr_subscriptions", "panel"]

[[panes]]
id = "codex-reset"
title = "Use a Codex reset"
placement = "overlay"
command = ["python3", "-m", "herdr_subscriptions", "reset-codex"]

[[actions]]
id = "select"
title = "Subscriptions: select agent"
command = ["python3", "-m", "herdr_subscriptions", "select"]

[[actions]]
id = "open-offers"
title = "Subscriptions: open Claude reset offers"
command = ["python3", "-m", "herdr_subscriptions", "open-offers"]

[[panes]]
id = "agent"
title = "Subscription agent"
placement = "tab"
command = ["sh", "-c", 'exec python3 -I "$HERDR_PLUGIN_ROOT/bin/subscription-agent"']
