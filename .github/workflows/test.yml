name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: node --test tests/browser-usage.test.js
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q herdr_subscriptions
      - run: python -m herdr_subscriptions status --demo --sidebar
